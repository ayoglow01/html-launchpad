<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Example Site</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 60ch; margin: 3rem auto; padding: 0 1rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <!-- Absolute URLs: this page is served for missing URLs at any depth. Replace with your domain. -->
    <a href="https://example.com/">Example Site</a>
  </header>
  <main>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <p><a href="https://example.com/">Go to the home page</a></p>
    <form action="https://example.com/search.html" method="get" role="search">
      <label for="q">Search the site</label>
      <input type="search" id="q" name="q">
      <button type="submit">Search</button>
    </form>
  </main>
</body>
</html>
