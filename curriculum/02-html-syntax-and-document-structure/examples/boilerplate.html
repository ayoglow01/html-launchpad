<!DOCTYPE html>
<!-- 1. DOCTYPE: switches the browser into standards mode. Not an element. -->
<html lang="en">
<!-- 2. Root element. lang = language of the CONTENT (BCP 47 code). -->
<head>
  <!-- 3. head = metadata about the document. Nothing here is page content. -->
  <meta charset="UTF-8">
  <!-- 4. Encoding. Must appear within the first 1024 bytes of the file. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 5. Mobile viewport. Never add user-scalable=no or maximum-scale=1. -->
  <title>Annotated boilerplate — html-cracker</title>
  <!-- 6. Required. Shown in tabs, bookmarks, history, and search results. -->
</head>
<body>
  <!-- 7. Everything the user sees goes in body. -->
  <h1>Annotated boilerplate</h1>
  <p>Open DevTools (F12) and compare the Elements panel with View Source (Ctrl+U).</p>
  <p>Characters work because of UTF-8: é, ñ, ₦, “quotes”, 🙂</p>
</body>
</html>
