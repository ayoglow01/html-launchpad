<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Meta CSP first. frame-ancestors must be sent as an HTTP header instead. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.example.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Debug 10 solution</title>
  <link rel="preload" href="../../../assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <script src="https://cdn.example.com/lib@3.2.1/lib.min.js" integrity="sha384-oqVuAfXRKap7fdgcCY5uykM6+R9GqQ8K/uxy9rx7HNQlGYl1kPzQho1wx4JwY8wC" crossorigin="anonymous" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <img src="../../../assets/images/hero-1200.jpg" alt="Shoppers at a Lagos market" width="1200" height="800" fetchpriority="high">
  <form action="/checkout" method="post">
    <!-- The server looks up the price from the cart; it never trusts a submitted price. -->
    <input type="hidden" name="cart_id" value="c_8f2a">
    <label for="card">Card number</label>
    <input type="text" id="card" name="card" inputmode="numeric" autocomplete="cc-number">
    <button type="submit">Pay ₦12,500</button>
  </form>
  <p id="greet"></p>
  <img src="../../../assets/images/project-one.jpg" alt="Featured product" width="800" height="500" loading="lazy" decoding="async">
</body>
</html>
