<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forms — Debug 07 solution</title>
</head>
<body>
  <h1>Create an account</h1>
  <form action="/register" method="post">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" autocomplete="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel">

    <label for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="new-password" minlength="8" required>

    <label for="state">State</label>
    <select id="state" name="state" required>
      <option value="">Choose a state</option>
      <option value="LA">Lagos</option>
      <option value="KN">Kano</option>
    </select>

    <fieldset>
      <legend>Gender (optional)</legend>
      <input type="radio" name="gender" value="female" id="f"><label for="f">Female</label>
      <input type="radio" name="gender" value="male" id="m"><label for="m">Male</label>
      <input type="radio" name="gender" value="unsaid" id="u"><label for="u">Prefer not to say</label>
    </fieldset>

    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" rows="4"></textarea>

    <label><input type="checkbox" name="terms" value="accepted" required> I accept the terms</label>

    <button type="submit">Register</button>
  </form>
</body>
</html>
