<!DOCTYPE html>
<!-- Tells the browser to use modern HTML5 standards. -->

<html lang="en">
<!--
  The root element of the HTML document.
  lang="en" tells browsers and screen readers
  that the page is written in English.
-->

<head>
  <!--
    Contains information ABOUT the webpage.
    Most of this information is not displayed
    directly on the page.
  -->

  <meta charset="UTF-8">
  <!--
    Sets the character encoding to UTF-8.
    This allows the page to display letters,
    numbers, symbols, and emojis correctly.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Helps the webpage display properly on
    mobile phones, tablets, and computers.

    width=device-width:
    Matches the viewport width to the device width.

    initial-scale=1:
    Sets the initial zoom level to 100%.
  -->

  <title>Page title — Site name</title>
  <!--
    Sets the title shown in the browser tab.
    It may also appear in bookmarks and search results.
  -->
</head>

<body>
  <!--
    Contains the visible content of the webpage,
    such as headings, paragraphs, images, and links.
  -->

  <h1>Page title</h1>
  <!--
    The main heading of the webpage.
    It describes the primary topic of the page.
  -->
</body>

</html>
<!-- Marks the end of the HTML document. -->
